# conda / mamba environment:  conda env create -f environment.yml && conda activate corenet
# then install the package itself:  pip install -e .
name: corenet
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - pytorch>=2.0
  - numpy>=1.21
  - h5py>=3.0
  - pyyaml>=5.4
  - scikit-learn>=1.0
  - onnx>=1.14
  - onnxruntime>=1.15
  - pytest>=7
  - pip
