name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Code Formatting & Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check code formatting with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Check code quality and linting with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

  package:
    name: Package Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata and rendering
        run: twine check --strict dist/*

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (Linux CPU)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,export]"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,export]"

      - name: Check CLI entry points
        run: |
          corenet-train --help
          corenet-evaluate --help
          corenet-export --help
          corenet-validate --help

      - name: Run pytest test suite
        run: |
          pytest tests/ -v

      - name: Validate example configurations
        run: |
          corenet-validate --config examples/hh4b/hh4b.yaml --input examples/data/hh4b_small.h5
          corenet-validate --config examples/bbww/bbww.yaml --input examples/data/bbww_small.h5

      - name: Run README walkthrough smoke test (HH -> 4b)
        run: |
          corenet-train --config examples/hh4b/hh4b.yaml --input examples/data/hh4b_small.h5 \
            --fold 0 --exclude-folds 1 --epochs 1 --batch-size-init 256 --device cpu --output-dir runs/ci_smoke_hh4b
          corenet-evaluate --checkpoint runs/ci_smoke_hh4b/model_fold0.pkl --input examples/data/hh4b_small.h5 \
            --output runs/ci_smoke_hh4b/eval_fold0.h5
          corenet-export --checkpoint runs/ci_smoke_hh4b/model_fold0.pkl --input examples/data/hh4b_small.h5 \
            --output-dir runs/ci_smoke_hh4b/export

      - name: Run README walkthrough smoke test (HH -> bbWW)
        run: |
          corenet-train --config examples/bbww/bbww.yaml --input examples/data/bbww_small.h5 \
            --fold 0 --exclude-folds 1 --epochs 1 --batch-size-init 256 --device cpu --output-dir runs/ci_smoke_bbww
          corenet-evaluate --checkpoint runs/ci_smoke_bbww/model_fold0.pkl --input examples/data/bbww_small.h5 \
            --output runs/ci_smoke_bbww/eval_fold0.h5
          corenet-export --checkpoint runs/ci_smoke_bbww/model_fold0.pkl --input examples/data/bbww_small.h5 \
            --output-dir runs/ci_smoke_bbww/export
