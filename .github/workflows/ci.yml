name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  format:
    name: Code Formatting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check code formatting with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU build of PyTorch to keep runner installation lightweight and fast
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install package in editable mode along with test and export optional dependencies
          pip install -e ".[test,export]"

      - name: Check CLI entry points
        run: |
          corenet-train --help
          corenet-evaluate --help
          corenet-export --help
          corenet-validate --help

      - name: Run pytest test suite
        run: |
          pytest tests/ -v

      - name: Validate example configurations
        run: |
          corenet-validate --config examples/hh4b/hh4b.yaml --input examples/data/hh4b_small.h5
          corenet-validate --config examples/bbww/bbww.yaml --input examples/data/bbww_small.h5
